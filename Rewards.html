<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rewards</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="Rewards.css">
</head>

<body>
    <header>
        <div class="menu">
            <img src="https://media.revistagq.com/photos/5d5d383031110c000879872d/1:1/w_1080,h_1080,c_limit/logo-starbucks.jpg"
                class="logo" width="50">

            <h2>Menú</h2>
            <h2>Rewards</h2>
        </div>

        <div class="opciones">
            <h2>Localizar tienda</h2>
            <button class="enlaces">Ingresar</button>
            <button class="enlaces">Únete</button>
        </div>
    </header>
    <section class="global">
        <section class="statica">
            <img src="https://rewards.starbucks.mx/img/title2.png" alt="" srcset="">
            <h2>Holaaaa, Cafe gratis</h2>
            <br><br><br>
            <button>Inicia Sesion</button>
            <button>Unete ahora</button>
        </section>

        <section class="scroll">
            <h2>Únete a Starbucks Rewards y desbloquea beneficios al ser <br>
                socio Nivel Green, todo mientras obtienes estrellas</h2>
            <br>
            <div class="tex-ima">
                <div class="card">
                    <img src="https://rewards.starbucks.mx/img/2023/06/nuevos-lanzamientos.png">
                    <p>Nuevos lanzamientos</p>
                </div>

                <div class="card">
                    <img src="https://rewards.starbucks.mx/img/2023/06/refill-cafe.png">
                    <p>Refill de café</p>
                </div>
                <div class="card">
                    <img src="https://rewards.starbucks.mx/img/2023/06/cumplea%C3%B1os.png">
                    <p>Recompensa de cumpleaños</p>
                </div>
                <div class="card">
                    <img src="https://rewards.starbucks.mx/img/2023/06/ofertas-personalizadas.png">
                    <p>Ofertas personalizadas</p>
                </div>
            </div>
        </section>
    </section>
</body>

</html>
